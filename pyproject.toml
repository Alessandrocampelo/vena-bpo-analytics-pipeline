[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vena-bpo-analytics-pipeline"
version = "1.0.0"
description = "Pipeline ELT (API + scraping + SQLite -> BigQuery) para o teste técnico de Analytics Engineer Sênior — Vena BPO"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "tenacity>=8.2",
    "pyarrow>=15.0",
    "google-cloud-storage>=2.16",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "google-cloud-bigquery>=3.20",
    "dagster>=1.7",
    "dagster-dbt>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "dagster-webserver>=1.7",
    "dbt-bigquery>=1.7",
]

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "dagster_project"]

[tool.dagster]
module_name = "dagster_project.definitions"
