[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vena-bpo-analytics-pipeline"
version = "0.1.0"
description = "Pipeline ELT (API + scraping + SQLite -> BigQuery) para o teste técnico de Analytics Engineer Sênior — Vena BPO"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "tenacity>=8.2",
    "pyarrow>=15.0",
    "google-cloud-storage>=2.16",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]

[tool.hatch.build.targets.wheel]
packages = ["ingestion"]
